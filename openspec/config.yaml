schema: spec-driven

context: |
  SonKey is Son's personal macOS Vietnamese input app.
  The MVP uses Telex, precomposed Unicode, and event-based text replacement.
  Composition underline is forbidden. Do not introduce marked text as the default integration.
  Required applications are VS Code, Chrome, Edge, Dia, and Apple Notes.
  Native transport must have evidence before the complete engine investment.
  Speak to Son in Vietnamese. Write repository artifacts in English.
  Claude and Codex share one workflow and an append-only development ledger.
  Reuse the pure core through semantic contracts. Keep macOS and development tooling outside it.
  Prefer bounded state and a serialized input pipeline without per-key tasks or I/O.
  Model checks, native compatibility, and performance measurements are separate evidence scopes.

rules:
  proposal:
    - Identify the usable outcome and its completion gate.
    - State exclusions and any change to the required application surfaces.
  specs:
    - Use SHALL or MUST requirements with concrete WHEN and THEN scenarios.
    - Keep native acceptance requirements distinct from source and model checks.
  design:
    - State dependency direction, state ownership, and the measured performance scope.
    - Explain each new component's benefit and material trade-off.
  tasks:
    - Group implementation and verification into reviewable outcomes.
    - Leave native verification pending until it has real application evidence.

operations:
  apply:
    guidance:
      - Use focused local checks and append milestone evidence to the development ledger.
      - Preserve existing user authorization without adding routine proposal approval loops.
  archive:
    guidance:
      - Check completion criteria and record the remaining limitations before archiving.
